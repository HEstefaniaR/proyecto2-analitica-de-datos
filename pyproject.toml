[project]
name = "proyecto-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Estefanía Hernández", email = "estefanna.hernnndez@uao.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "simpleitk>=2.5.6",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[tool.uv.workspace]
members = []

# PyTorch con CUDA en Windows/Linux (RTX 3060, driver 576 -> CUDA 12.9: rueda cu126).
# En macOS se usa la rueda de PyPI (MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
