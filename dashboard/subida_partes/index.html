<!doctype html>
<!-- Subida de un CT por partes (componente de Streamlit sin compilar).
     El navegador corta el archivo en trozos y los manda uno por uno por el websocket de Streamlit; espera la
     confirmación de cada uno antes de mandar el siguiente. Sirve para archivos grandes detrás del túnel, donde una
     sola petición larga se corta por tiempo. Cada mensaje = cabecera de 256 bytes (JSON) + los bytes del trozo. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Source Sans Pro", sans-serif; font-size: 14px; color: #fafafa; background: transparent; }
  .light body, body.light { color: #31333f; }
  #caja { border: 1px dashed rgba(128, 128, 128, 0.6); border-radius: 8px; padding: 10px; }
  #barra { height: 8px; border-radius: 4px; background: rgba(128, 128, 128, 0.3); margin-top: 8px; overflow: hidden; }
  #avance { height: 100%; width: 0%; background: #ff4b4b; transition: width 0.2s; }
  #estado { margin-top: 6px; font-size: 12.5px; opacity: 0.85; word-break: break-all; }
  input[type=file] { color: inherit; max-width: 100%; }
</style>
</head>
<body>
<div id="caja">
  <input type="file" id="archivo" accept=".mha,.nii,.gz">
  <div id="barra"><div id="avance"></div></div>
  <div id="estado">Elige un archivo .mha, .nii o .nii.gz</div>
</div>
<script>
const CABECERA = 256;
let trozo = 4 * 1024 * 1024;      // bytes por parte (lo puede cambiar Python con el argumento `trozo_mb`)
let ack = null;                   // última confirmación recibida de Python: "<id>:<índice>"
let esperando = null;             // función que resuelve la espera de la confirmación

function enviar(tipo, datos) { window.parent.postMessage({ isStreamlitMessage: true, type: tipo, ...datos }, "*"); }
function alto() { enviar("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 }); }
function estado(t, fraccion) {
  document.getElementById("estado").textContent = t;
  if (fraccion !== undefined) document.getElementById("avance").style.width = (100 * fraccion).toFixed(1) + "%";
  alto();
}

window.addEventListener("message", (ev) => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  const a = ev.data.args || {};
  if (a.trozo_mb) trozo = Math.round(a.trozo_mb * 1024 * 1024);
  if (ev.data.theme && ev.data.theme.textColor) document.body.style.color = ev.data.theme.textColor;
  ack = a.ack || null;
  if (esperando) esperando();
  alto();
});

function confirmado(clave) {
  return new Promise((resolver) => {
    const revisar = () => { if (ack === clave) { esperando = null; resolver(); } };
    esperando = revisar;
    revisar();
  });
}

async function subirArchivo(archivo) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const n = Math.max(1, Math.ceil(archivo.size / trozo));
  const t0 = performance.now();
  for (let i = 0; i < n; i++) {
    const datos = new Uint8Array(await archivo.slice(i * trozo, (i + 1) * trozo).arrayBuffer());
    const cab = new TextEncoder().encode(JSON.stringify({ id: id, i: i, n: n, nombre: archivo.name, tam: archivo.size }));
    const msg = new Uint8Array(CABECERA + datos.length);
    msg.fill(32, 0, CABECERA);
    msg.set(cab.slice(0, CABECERA), 0);
    msg.set(datos, CABECERA);
    enviar("streamlit:setComponentValue", { value: msg, dataType: "bytes" });
    await confirmado(id + ":" + i);
    const mb = Math.min((i + 1) * trozo, archivo.size) / 1048576;
    const seg = (performance.now() - t0) / 1000;
    estado(`Subiendo ${archivo.name}: ${mb.toFixed(0)} de ${(archivo.size / 1048576).toFixed(0)} MB (${(mb / seg).toFixed(1)} MB/s)`, (i + 1) / n);
  }
  estado(`Listo: ${archivo.name} (${(archivo.size / 1048576).toFixed(0)} MB)`, 1);
}
window.subirArchivo = subirArchivo;

document.getElementById("archivo").addEventListener("change", (ev) => {
  if (ev.target.files.length) subirArchivo(ev.target.files[0]);
});

enviar("streamlit:componentReady", { apiVersion: 1 });
alto();
</script>
</body>
</html>
